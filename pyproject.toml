[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cerberus-ai"
version = "0.1.0"
description = "cerberus</> - Autonomous Multi-Agent Code Review & Quality Assurance System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "CodeVault / Cerberus Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "langchain>=0.1.0",
    "langgraph>=0.0.30",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "redis>=5.0.0",
    "prometheus-client>=0.20.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "python-jose[cryptography]>=3.3.0",
    "websockets>=12.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.1.0",
    "httpx2>=0.1.0"
]

[project.scripts]
cerberus = "cerberus.cli.main:app"
codevault = "cerberus.cli.main:app"
