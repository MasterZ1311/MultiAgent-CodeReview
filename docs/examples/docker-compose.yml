# CodeVault AI - Complete Docker Compose Configuration
# This is a production-ready configuration with all services

version: '3.8'

services:
  # Main API Service
  api:
    image: codevault/api:latest
    container_name: codevault-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Server settings
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=4
      
      # Database
      - DATABASE_URL=postgresql://codevault:${DB_PASSWORD:-change_me_in_production}@db:5432/codevault
      
      # Redis cache
      - REDIS_URL=redis://redis:6379/0
      - CACHE_ENABLED=true
      - CACHE_TTL_SECONDS=604800
      
      # LLM Provider (choose one)
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      
      # Agents
      - ENABLED_AGENTS=security,performance,quality
      
      # Security
      - SECRET_KEY=${SECRET_KEY:-change_me_in_production}
      - API_KEY_PREFIX=cvai_
      
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      
      # Monitoring
      - PROMETHEUS_ENABLED=true
    depends_on:
      - db
      - redis
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - codevault-network

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: codevault-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=codevault
      - POSTGRES_USER=codevault
      - POSTGRES_PASSWORD=${DB_PASSWORD:-change_me_in_production}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codevault"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codevault-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: codevault-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codevault-network

  # Ollama (Optional - for local LLM)
  ollama:
    image: ollama/ollama:latest
    container_name: codevault-ollama
    restart: unless-stopped
    profiles:
      - ollama  # Only start if profile is specified
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - codevault-network

  # Prometheus (Monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: codevault-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - codevault-network

  # Grafana (Visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: codevault-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - codevault-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  codevault-network:
    driver: bridge

# Usage Examples:
#
# Start all services:
#   docker-compose up -d
#
# Start with Ollama:
#   docker-compose --profile ollama up -d
#
# View logs:
#   docker-compose logs -f api
#
# Stop all services:
#   docker-compose down
#
# Stop and remove volumes (WARNING: deletes data):
#   docker-compose down -v
#
# Restart API only:
#   docker-compose restart api
#
# Scale API workers:
#   docker-compose up -d --scale api=3
